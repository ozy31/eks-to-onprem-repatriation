# Backups to Ceph RGW (replaces RDS automated backups and snapshots).
# Rook creates the bucket and a Secret with its keys; the ObjectStore uses them
# directly.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: orders-db-backups
  namespace: orders
spec:
  bucketName: orders-db-backups
  storageClassName: ceph-bucket
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: orders-db-backups
  namespace: orders
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://orders-db-backups/
    endpointURL: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc
    s3Credentials:
      accessKeyId:
        name: orders-db-backups
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: orders-db-backups
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: zstd
      maxParallel: 4
    data:
      compression: gzip
      jobs: 4
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: orders-db-daily
  namespace: orders
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: orders-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
