# RDS -> CloudNativePG. The publication "orders_migration" is created on RDS by
# rds-source.sql. CloudNativePG creates the subscription, copies every table
# and then streams changes until the cutover (cutover.sh).
apiVersion: postgresql.cnpg.io/v1
kind: Subscription
metadata:
  name: orders-from-rds
  namespace: orders
spec:
  cluster:
    name: orders-db
  name: orders_from_rds
  dbname: orders
  publicationName: orders_migration
  externalClusterName: rds
  parameters:
    # One slot on RDS; binary transfer is faster for the initial copy.
    binary: "true"
    streaming: parallel
  subscriptionReclaimPolicy: delete
