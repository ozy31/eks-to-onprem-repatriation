name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.15.5"
  KUBECONFORM_VERSION: "v0.8.0"
  TALOS_VERSION: "v1.14.5"
  KUSTOMIZE_VERSION: "v5.8.3"

jobs:
  lint:
    name: yamllint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: yamllint
        run: yamllint -s .

      - name: shellcheck
        run: make shell

  manifests:
    name: manifests (kubeconform + helm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4

      - name: install kubeconform and kustomize
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kubeconform
          curl -sfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kustomize
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: versions
        run: kubeconform -v && kustomize version && helm version --short && yq --version

      - name: validate
        run: make manifests

  talos:
    name: talos machine configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install talosctl
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sfL -o "$HOME/.local/bin/talosctl" \
            "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-linux-amd64"
          chmod +x "$HOME/.local/bin/talosctl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: generate and validate
        run: make talos

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: fmt + validate
        run: make terraform

  tco:
    name: tco model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: tests + example
        run: make tco

  security:
    name: trivy config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: trivy config
        # v0.36.0, pinned by commit SHA
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
