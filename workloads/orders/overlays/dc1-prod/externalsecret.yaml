apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: orders-db
  data:
    - secretKey: url
      remoteRef:
        key: prod/orders/database
        property: url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-kafka
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: orders-kafka
  data:
    - secretKey: password
      remoteRef:
        key: prod/orders/kafka
        property: password
