# Applied to every node. Talos replaces the EKS-optimized AMI: immutable,
# API-managed, no SSH; upgrades are an image swap (talosctl upgrade).
#
# Talos 1.14 multi-document machine config: each document configures one area.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  # The system disk; data disks nvme1n1.. are left to Ceph.
  diskSelector:
    match: disk.dev_path == "/dev/nvme0n1"
  wipe: false
---
# Cilium is installed by `make bootstrap`: no Flannel, no kube-proxy.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  # Serving certificates signed by the cluster, approved by
  # kubelet-serving-cert-approver (controlplane.yaml).
  serverTLSBootstrap: true
  # Reserve capacity for Talos and the kubelet so pods cannot starve them.
  systemReserved:
    cpu: 500m
    memory: 1Gi
  kubeReserved:
    cpu: 500m
    memory: 1Gi
  evictionHard:
    memory.available: 500Mi
    nodefs.available: 10%
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.core.somaxconn: "65535"
  net.ipv4.tcp_max_syn_backlog: "8192"
  vm.max_map_count: "262144"
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - 10.10.0.1
    - 10.10.0.2
