# Replaces the AWS Load Balancer Controller + ALB. One shared Gateway; services
# attach HTTPRoutes from their own namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway
  annotations:
    # cert-manager creates the wildcard certificate from the listener below.
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  gatewayClassName: cilium
  infrastructure:
    labels:
      lb.dc1.example.com/pool: public
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-example-com
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.dc1.example.com/public: "true"
    - name: https-origin
      protocol: HTTPS
      port: 443
      hostname: "*.dc1.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-dc1-example-com
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.dc1.example.com/public: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
